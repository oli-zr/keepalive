name: Feature request
description: Suggest an idea for KeepAlive.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could KeepAlive help?
      description: Your idea for a solution, if you have one.
