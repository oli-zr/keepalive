# Keeps the GitHub Actions used by the workflow up to date. KeepAlive has no other
# dependencies, so this is the only thing to watch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update GitHub Actions"
    labels: [dependencies]
