name: Build

# Pushes and pull requests only check that KeepAlive builds.
# Pushing a version tag (for example v1.0) publishes a release with KeepAlive.zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # The Liquid Glass icon and the current design need the macOS 26 SDK or later.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build KeepAlive.app
        run: scripts/build_app.sh --universal

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/KeepAlive.zip \
            --title "KeepAlive ${GITHUB_REF_NAME#v}" \
            --generate-notes
