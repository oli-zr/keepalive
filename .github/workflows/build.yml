name: Build

# Pushes and pull requests check the workflow and scripts, run the tests and build KeepAlive.app.
# Pushing a version tag (for example v1.2) also publishes a release with KeepAlive.zip.
# The Update tools workflow starts it by hand for its own pull requests.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Everything runs read-only. Only the release job gets write access, and only for tags.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
# Release runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Reads .github/ci.env. Workflows cannot edit workflow files, so the versions that the
  # Update tools workflow maintains live there.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xcode-runner: ${{ steps.read.outputs.XCODE_RUNNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci.env
          sparse-checkout-cone-mode: false

      - id: read
        run: grep '^[A-Z_]*=' .github/ci.env >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}."
            exit 1
          }

      - name: Install actionlint and shellcheck
        run: |
          grep '^[A-Z_]*=' .github/ci.env >> "$GITHUB_ENV"
          . .github/ci.env
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v$ACTIONLINT_VERSION/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint also checks the run steps with the shellcheck installed above.
      - name: Check the workflows
        run: actionlint -color

      - name: Check the shell scripts
        run: shellcheck scripts/*.sh

  # The ruleset for main requires this job by its name, so keep it called "build".
  build:
    needs: config
    # The Liquid Glass icon and the current design need the macOS 26 SDK or later.
    runs-on: ${{ needs.config.outputs.xcode-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: swift test

      - name: Build KeepAlive.app
        run: scripts/build_app.sh --universal

      # Lets you try the app from a pull request, and hands the build to the release job.
      - name: Upload KeepAlive.zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeepAlive
          path: build/KeepAlive.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create releases
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release notes fall back to the commits since the previous tag.
          fetch-depth: 0

      - name: Download KeepAlive.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KeepAlive
          path: build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/KeepAlive.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release_notes.sh "$GITHUB_REF_NAME" build/KeepAlive.zip > release-notes.md
          # The in-app updater verifies the download against this checksum.
          shasum -a 256 build/KeepAlive.zip | cut -d ' ' -f 1 > build/KeepAlive.zip.sha256
          # Releases are immutable once published, so attach every file to a draft first.
          gh release create "$GITHUB_REF_NAME" build/KeepAlive.zip build/KeepAlive.zip.sha256 \
            --draft \
            --title "KeepAlive ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
