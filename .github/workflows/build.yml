name: Build

# Pushes and pull requests only check that KeepAlive builds.
# Pushing a version tag (for example v1.0) publishes a release with KeepAlive.zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # The Liquid Glass icon and the current design need the macOS 26 SDK or later.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes fall back to the commits since the previous tag.
          fetch-depth: 0

      - name: Build KeepAlive.app
        run: scripts/build_app.sh --universal

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release_notes.sh "$GITHUB_REF_NAME" build/KeepAlive.zip > release-notes.md
          # The in-app updater verifies the download against this checksum.
          shasum -a 256 build/KeepAlive.zip | cut -d ' ' -f 1 > build/KeepAlive.zip.sha256
          gh release create "$GITHUB_REF_NAME" build/KeepAlive.zip build/KeepAlive.zip.sha256 \
            --title "KeepAlive ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
