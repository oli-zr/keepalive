# Keeps the GitHub Actions used by the workflows up to date. KeepAlive has no other
# dependencies. The Xcode runner image and the lint tools are in .github/ci.env, which the
# Update tools workflow maintains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update GitHub Actions"
    labels: [dependencies]
